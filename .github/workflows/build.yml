name: Build

permissions:
  contents: read
  packages: write

on:
  workflow_call:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Builder
    runs-on: ubuntu-latest
    container: ghcr.io/matthewbaggett/act-runner:php8.5
    permissions:
      checks: write # For trunk to post annotations
      contents: read # For repo checkout
      packages: write # For pushing images to GHCR
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        if: env.PUBLISH == 'true'
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@v4

      # We build on Forgejo, so `secrets.GITHUB_TOKEN` is a git.grey.ooo token
      # and GHCR rejects it with `denied: denied`. Both registries therefore
      # authenticate with their own dedicated PAT — GHCR_PAT needs
      # `write:packages`.
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      # `org.opencontainers.image.created` is specified as when the image was
      # built, so it has to be generated here — the repository's updated_at is
      # a different thing entirely and is not reliably populated on Forgejo.
      - name: "Build timestamp"
        id: meta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: "Bake + Publish images"
        uses: docker/bake-action@v7
        env:
          MULTIARCH: ${{ env.PUBLISH }}
          VCS_REF: ${{ github.sha }}
          BUILD_DATE: ${{ steps.meta.outputs.date }}
        with:
          source: .
          push: ${{ env.PUBLISH == 'true' }}
